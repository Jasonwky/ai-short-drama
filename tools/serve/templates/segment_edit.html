{% extends "base.html" %}
{% from "_macros.html" import checklist %}
{% block content %}
<h1>段落 {{ seg.number }} <a class="btn small" href="/episode/{{ seg.episode_id }}/storyboard">← 回分镜表</a></h1>
<div class="row">
  <section class="card" style="flex: 2; min-width: 420px">
    <form method="post" action="/segment/{{ seg.id }}/edit" data-live-check>
      <label>描述(用【镜头N】分子镜头;台词写成「林小雨说：「……」」)</label>
      <textarea class="tall" name="description">{{ seg.description }}</textarea>
      <label>时长(秒)</label>
      <input type="number" step="0.5" name="duration_sec" value="{{ seg.duration_sec if seg.duration_sec is not none else '' }}">
      <div class="live" data-live-result></div>
      <label>首帧图提示词(用 @名字 引用本段绑定的素材)</label>
      <textarea name="image_prompt">{{ seg.image_prompt }}</textarea>
      <label>视频提示词</label>
      <textarea name="video_prompt">{{ seg.video_prompt }}</textarea>
      <label>参考模式</label>
      <select name="reference_mode">
        {% for key, label in modes %}<option value="{{ key }}" {% if key == seg.reference_mode %}selected{% endif %}>{{ label }}</option>{% endfor %}
      </select>
      <label>场景</label>
      <select name="scene_id">
        <option value="">(不绑定)</option>
        {% for s in all_of.scene %}<option value="{{ s.id }}" {% if s.id == seg.scene_id %}selected{% endif %}>{{ s.name }}</option>{% endfor %}
      </select>
      <label>角色</label>
      {% for c in all_of.character %}
        <span><input type="checkbox" name="character_ids" value="{{ c.id }}" id="c{{ c.id }}" {% if c.id in bound_chars %}checked{% endif %}><label for="c{{ c.id }}" style="display:inline">{{ c.name }}</label></span>
      {% else %}<span class="empty">剧里还没有角色(去「资产」添加)</span>{% endfor %}
      <label>道具</label>
      {% for p in all_of.prop %}
        <span><input type="checkbox" name="prop_ids" value="{{ p.id }}" id="p{{ p.id }}" {% if p.id in bound_props %}checked{% endif %}><label for="p{{ p.id }}" style="display:inline">{{ p.name }}</label></span>
      {% else %}<span class="empty">剧里还没有道具</span>{% endfor %}
      <div><button class="btn primary" type="submit" data-save-segment>保存段落</button></div>
    </form>
  </section>
  <section class="card" style="flex: 1; min-width: 280px" data-readiness>
    <h2>还差什么</h2>
    {{ checklist(checks) }}
  </section>
</div>
{% endblock %}
